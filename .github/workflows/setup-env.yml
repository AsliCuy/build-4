name: Setup Build Environment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release environment (e.g. build-env-v1)'
        required: true
        default: 'build-env-v1'

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Extras (NDK + Platforms + Build Tools)
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "ndk;27.0.12077973" \
            "ndk;28.2.13676358" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "platforms;android-36" 2>&1 | tail -5 || true

          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=$ANDROID_HOME \
            "platforms;android-37" 2>&1 | tail -3 || true

          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            for VARIANT in "android-37.0" "android-37.1" "android-37.2-beta1" "android-37.2"; do
              if [ -d "$ANDROID_HOME/platforms/$VARIANT" ]; then
                cp -r "$ANDROID_HOME/platforms/$VARIANT" "$ANDROID_HOME/platforms/android-37"
                sed -i 's|<api-level>[0-9.]*</api-level>|<api-level>37</api-level>|g' \
                  "$ANDROID_HOME/platforms/android-37/package.xml" || true
                sed -i 's|<codename>[^<]*</codename>|<codename></codename>|g' \
                  "$ANDROID_HOME/platforms/android-37/package.xml" || true
                sed -i -E 's/path="platforms;android-37[^"]*"/path="platforms;android-37"/g' \
                  "$ANDROID_HOME/platforms/android-37/package.xml" || true
                echo "android-37 dibuat dari $VARIANT"
                break
              fi
            done
          fi

          echo "=== SDK Platforms yang akan disimpan ==="
          ls "$ANDROID_HOME/platforms/" 2>/dev/null
          ls "$ANDROID_HOME/ndk/" 2>/dev/null | head -5

          echo "Compressing android-sdk-extras..."
          tar -czf /tmp/android-sdk-extras.tar.gz \
            -C /usr/local/lib/android/sdk \
            ndk \
            platforms \
            build-tools \
            2>/dev/null
          echo "android-sdk-extras.tar.gz: $(du -sh /tmp/android-sdk-extras.tar.gz | cut -f1)"

      - name: Setup Dart SDK (untuk FVM)
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Install & Compress Flutter 3.32.0
        run: |
          fvm install 3.32.0
          mkdir -p ~/.fvm/versions
          tar -czf /tmp/fvm-3.32.0.tar.gz -C ~/.fvm/versions 3.32.0
          echo "fvm-3.32.0.tar.gz: $(du -sh /tmp/fvm-3.32.0.tar.gz | cut -f1)"
          rm -rf ~/.fvm/versions/3.32.0

      - name: Install & Compress Flutter 3.32.5
        run: |
          fvm install 3.32.5
          tar -czf /tmp/fvm-3.32.5.tar.gz -C ~/.fvm/versions 3.32.5
          echo "fvm-3.32.5.tar.gz: $(du -sh /tmp/fvm-3.32.5.tar.gz | cut -f1)"
          rm -rf ~/.fvm/versions/3.32.5

      - name: Install & Compress Flutter 3.35.0
        run: |
          fvm install 3.35.0
          tar -czf /tmp/fvm-3.35.0.tar.gz -C ~/.fvm/versions 3.35.0
          echo "fvm-3.35.0.tar.gz: $(du -sh /tmp/fvm-3.35.0.tar.gz | cut -f1)"
          rm -rf ~/.fvm/versions/3.35.0

      - name: Install & Compress Flutter 3.38.0
        run: |
          fvm install 3.38.0
          tar -czf /tmp/fvm-3.38.0.tar.gz -C ~/.fvm/versions 3.38.0
          echo "fvm-3.38.0.tar.gz: $(du -sh /tmp/fvm-3.38.0.tar.gz | cut -f1)"
          rm -rf ~/.fvm/versions/3.38.0

      - name: Install & Compress Flutter 3.47.0
        run: |
          fvm install 3.47.0
          tar -czf /tmp/fvm-3.47.0.tar.gz -C ~/.fvm/versions 3.47.0
          echo "fvm-3.47.0.tar.gz: $(du -sh /tmp/fvm-3.47.0.tar.gz | cut -f1)"
          rm -rf ~/.fvm/versions/3.47.0

      - name: Install & Compress Flutter 3.47.6
        run: |
          fvm install 3.47.6
          tar -czf /tmp/fvm-3.47.6.tar.gz -C ~/.fvm/versions 3.47.6
          echo "fvm-3.47.6.tar.gz: $(du -sh /tmp/fvm-3.47.6.tar.gz | cut -f1)"
          rm -rf ~/.fvm/versions/3.47.6

      - name: Summary ukuran semua asset
        run: |
          echo "=== Total asset yang akan diupload ==="
          du -sh /tmp/fvm-*.tar.gz /tmp/android-sdk-extras.tar.gz
          du -shc /tmp/fvm-*.tar.gz /tmp/android-sdk-extras.tar.gz | tail -1

      - name: Publish ke GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"

          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --title "Build Environment: $TAG" \
            --notes "Pre-installed Flutter pool + Android SDK/NDK for build workers. Dibuat: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --prerelease \
            /tmp/android-sdk-extras.tar.gz \
            /tmp/fvm-3.32.0.tar.gz \
            /tmp/fvm-3.32.5.tar.gz \
            /tmp/fvm-3.35.0.tar.gz \
            /tmp/fvm-3.38.0.tar.gz \
            /tmp/fvm-3.47.0.tar.gz \
            /tmp/fvm-3.47.6.tar.gz

          echo ""
          echo "✅ Release $TAG berhasil dibuat"
          echo "=== Asset sizes ==="
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name): \(.size / 1048576 | floor)MB"'